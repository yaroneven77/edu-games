  <title id="title">Pulse — פעימה</title>
  <desc id="desc">Original adult female science-fiction rescuer in a white, plum and coral articulated suit. Side-swept auburn hair, proportionate open five-finger welcoming hand, wrist rescue equipment and an asymmetric practical silhouette. Full-body comic-book illustration with a larger, clearly readable head.</desc>
