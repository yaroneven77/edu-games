<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>מִסְפָּרִים עַד מִילְיוֹן · כִּתָּה ד'</title>
<script data-goatcounter="https://yaroneven.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
  :root{--blue:#1f7fc4;--green:#3fbf6b;--red:#e6604f;--purple:#a974d6;--ink:#243b53;--shadow:rgba(20,60,90,.18);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#fff7e6,#cdeffd);display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;}
  header{text-align:center;padding:14px 8px 4px;}
  .home{display:inline-block;background:#fff;border-radius:14px;padding:5px 12px;font-size:20px;text-decoration:none;
    box-shadow:0 3px 0 var(--shadow);margin-bottom:8px;}
  .logo{font-weight:900;font-size:clamp(27px,7vw,46px);color:#ffce3a;
    text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--blue),0 6px 14px var(--shadow);}
  .logo small{display:block;font-size:.43em;color:#155f93;text-shadow:none;margin-top:4px;}
  main{width:100%;max-width:700px;padding:8px 14px 30px;flex:1;}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px;gap:8px;}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-weight:900;box-shadow:0 4px 0 var(--shadow);}
  .learn{border:none;border-radius:16px;padding:9px 14px;background:var(--purple);color:#fff;font:800 15px inherit;cursor:pointer;box-shadow:0 4px 0 var(--shadow);}
  .card{background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 8px 0 var(--shadow);text-align:center;}
  .kind{display:inline-block;background:#eaf4fb;color:#155f93;border-radius:999px;padding:5px 13px;font-weight:800;font-size:14px;}
  h2{font-size:clamp(20px,5vw,27px);line-height:1.55;margin:14px 0;}
  .number{direction:ltr;font-size:clamp(38px,11vw,60px);font-weight:900;color:#155f93;letter-spacing:2px;margin:8px 0 18px;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .choice{border:3px solid #d6e7f3;background:#eef6fc;border-radius:18px;padding:15px 8px;font:900 23px inherit;
    color:var(--ink);cursor:pointer;direction:ltr;}
  .choice:active{transform:scale(.97);}
  .choice.ok{background:#d8f5e2;border-color:var(--green);}
  .choice.no{background:#fcdcd6;border-color:var(--red);}
  .symbols{grid-template-columns:repeat(3,1fr);}
  .symbols .choice{font-size:34px;}
  .feedback{min-height:38px;font-size:22px;font-weight:900;margin:16px 0 8px;}
  .feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button.action{border:none;border-radius:16px;padding:11px 18px;font:800 16px inherit;color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--shadow);}
  .help{background:var(--purple)} .next{background:var(--blue)}
  .explain{margin-top:14px;background:#f3ecfb;border:3px dashed #c9a8ec;border-radius:18px;padding:14px 16px;
    line-height:1.7;text-align:right;font-size:17px;}
  .hidden{display:none!important;}
  .lesson-overlay{position:fixed;inset:0;background:rgba(20,40,60,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .lesson-overlay.show{display:flex;}
  .lesson-modal{background:#fff;border-radius:24px;width:100%;max-width:680px;max-height:94vh;overflow:auto;padding:22px 18px;text-align:center;box-shadow:0 18px 45px rgba(20,60,90,.35);}
  .lesson-close{float:left;border:none;background:#e7eef5;color:#43617c;border-radius:12px;padding:7px 11px;font:800 14px inherit;cursor:pointer;}
  .lesson-progress{color:var(--purple);font-weight:900;font-size:14px;clear:both;padding-top:4px;}
  .lesson-title{font-size:clamp(22px,6vw,30px);font-weight:900;color:#155f93;margin:8px 0;}
  .lesson-text{font-size:clamp(17px,4.5vw,21px);line-height:1.65;min-height:60px;}
  .lesson-visual{direction:ltr;font-size:clamp(34px,11vw,58px);font-weight:900;color:#155f93;margin:15px 0;}
  .lesson-table{display:grid;grid-template-columns:repeat(6,1fr);direction:ltr;border:2px solid #bed5e5;border-radius:12px;overflow:hidden;margin:12px auto;}
  .lesson-table div{padding:7px 2px;border-left:1px solid #bed5e5;font-size:clamp(9px,2.5vw,13px);}
  .lesson-table .head{background:#eaf4fb;color:#43617c;font-weight:800}.lesson-table .digit{font-size:21px;font-weight:900}
  .lesson-table .hot{background:#fff1b8;color:#b13a26;}
  .lesson-options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .lesson-options button{border:3px solid #d6e7f3;background:#fff;border-radius:14px;padding:10px 14px;font:900 17px inherit;cursor:pointer;direction:ltr;}
  .lesson-options button.ok{background:#d8f5e2;border-color:var(--green)}.lesson-options button.no{background:#fcdcd6;border-color:var(--red)}
  .lesson-feedback{min-height:28px;font-weight:900;margin-top:8px;}
  .lesson-nav{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .lesson-nav button{border:none;border-radius:14px;padding:10px 15px;font:800 15px inherit;color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--shadow);}
  .gray{background:#8aa4bd}.green{background:var(--green)}.blue{background:var(--blue)}
  footer{padding:10px;color:#6b87a3;font-size:12px;}
  @media(max-width:430px){.choices{grid-template-columns:1fr}.symbols{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <a class="home" href="../">⬆️🏠</a>
  <div class="logo">מִסְפָּרִים עַד מִילְיוֹן<small>חֶשְׁבּוֹן לְכִתָּה ד'</small></div>
</header>
<main>
  <div class="topbar">
    <div class="pill">שְׁאֵלָה <span id="round">1</span></div>
    <button class="learn" onclick="openLesson()">📚 שִׁעוּר קָצָר</button>
    <div class="pill">⭐ <span id="score">0</span></div>
  </div>
  <div class="card">
    <span class="kind" id="kind"></span>
    <h2 id="question"></h2>
    <div class="number" id="number"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="action help hidden" id="help" onclick="toggleExplain()">🔍 אֵיךְ פּוֹתְרִים?</button>
      <button class="action next hidden" id="next" onclick="newQuestion()">הַבָּא ➜</button>
    </div>
    <div class="explain hidden" id="explain"></div>
  </div>
</main>
<div class="lesson-overlay" id="lesson-overlay">
  <div class="lesson-modal">
    <button class="lesson-close" onclick="closeLesson()">✕ סְגֹר</button>
    <div class="lesson-progress" id="lesson-progress"></div>
    <div class="lesson-title" id="lesson-title"></div>
    <div class="lesson-text" id="lesson-text"></div>
    <div class="lesson-visual" id="lesson-visual"></div>
    <div class="lesson-table" id="lesson-table"></div>
    <div id="lesson-practice"></div>
    <div class="lesson-nav">
      <button class="gray" id="lesson-prev" onclick="moveLesson(-1)">◀ הַקּוֹדֵם</button>
      <button class="green" onclick="speakLesson()">🔊 הַשְׁמֵעַ</button>
      <button class="blue" id="lesson-next" onclick="moveLesson(1)">הַבָּא ▶</button>
    </div>
  </div>
</div>
<footer>מִסְפָּרִים טִבְעִיִּים · כִּתָּה ד'</footer>
<script>
const $=id=>document.getElementById(id);
const rnd=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=n=>n.toLocaleString("en-US");
const GOOD=["מְצֻיָּן! ⭐","נָכוֹן מְאוֹד! 🎉","כָּל הַכָּבוֹד! 👏","חֲשִׁיבָה נֶהְדֶּרֶת! 🏆"];
let score=0,round=0,current=null,locked=false,lastSig="";
let lessonIndex=0,hebrewVoice=null;

const LESSON_STEPS=[
  {title:"לְכָל סִפְרָה יֵשׁ מָקוֹם",text:"הָעֵרֶךְ שֶׁל סִפְרָה מִשְׁתַּנֶּה לְפִי הַמָּקוֹם שֶׁלָּהּ בַּמִּסְפָּר.",visual:"472,615",hot:-1,practice:false,say:"לכל ספרה יש מקום. הערך של ספרה משתנה לפי המקום שלה במספר."},
  {title:"מְאַתְּרִים אֶת הַסִּפְרָה 7",text:"הַסִּפְרָה 7 נִמְצֵאת בִּמְקוֹם עֲשֶׂרֶת הָאֲלָפִים.",visual:"472,615",hot:1,practice:false,say:"במספר ארבע מאות שבעים ושניים אלף, שש מאות וחמש עשרה, הספרה שבע נמצאת במקום עשרת האלפים."},
  {title:"מְחַשְּׁבִים אֶת הָעֵרֶךְ",text:"7 עֲשָׂרוֹת אֲלָפִים הֵן 7 × 10,000. לָכֵן הָעֵרֶךְ הוּא 70,000.",visual:"7 × 10,000 = 70,000",hot:1,practice:false,say:"שבע עשרות אלפים הן שבע כפול עשרת אלפים. לכן הערך הוא שבעים אלף."},
  {title:"עַכְשָׁו תּוֹרְכֶם!",text:"בַּמִּסְפָּר 325,481, מָה הָעֵרֶךְ שֶׁל הַסִּפְרָה 5?",visual:"325,481",hot:-1,practice:true,say:"עכשיו תורכם. במספר שלוש מאות עשרים וחמישה אלף, ארבע מאות שמונים ואחת, מה הערך של הספרה חמש?"}
];
const PLACE_HEADS=["מֵאוֹת אֲלָפִים","עֲשֶׂרֶת אֲלָפִים","אֲלָפִים","מֵאוֹת","עֲשָׂרוֹת","אֲחָדוֹת"];
const PLACE_DIGITS=["4","7","2","6","1","5"];

function loadVoices(){
  if(!("speechSynthesis" in window))return;
  hebrewVoice=speechSynthesis.getVoices().find(v=>/^(he|iw)/i.test(v.lang))||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speakHebrew(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);utterance.lang="he-IL";utterance.rate=.9;
  if(hebrewVoice)utterance.voice=hebrewVoice;speechSynthesis.speak(utterance);
}
function openLesson(){lessonIndex=0;$("lesson-overlay").classList.add("show");renderLesson();}
function closeLesson(){$("lesson-overlay").classList.remove("show");if("speechSynthesis" in window)speechSynthesis.cancel();}
function moveLesson(direction){const next=lessonIndex+direction;if(next<0||next>=LESSON_STEPS.length)return;lessonIndex=next;renderLesson();}
function speakLesson(){speakHebrew(LESSON_STEPS[lessonIndex].say);}
function renderLesson(){
  const step=LESSON_STEPS[lessonIndex];
  $("lesson-progress").textContent=`שָׁלָב ${lessonIndex+1} מִתּוֹךְ ${LESSON_STEPS.length}`;
  $("lesson-title").textContent=step.title;$("lesson-text").textContent=step.text;$("lesson-visual").textContent=step.visual;
  $("lesson-table").style.display=step.practice||lessonIndex===2?"none":"grid";
  $("lesson-table").innerHTML=PLACE_HEADS.map((head,index)=>`<div class="head ${index===step.hot?"hot":""}">${head}</div>`).join("")+
    PLACE_DIGITS.map((digit,index)=>`<div class="digit ${index===step.hot?"hot":""}">${digit}</div>`).join("");
  $("lesson-practice").innerHTML=step.practice?`<div class="lesson-options">
    <button onclick="checkLessonAnswer(this,500)">500</button><button onclick="checkLessonAnswer(this,5000)">5,000</button><button onclick="checkLessonAnswer(this,50000)">50,000</button>
    </div><div class="lesson-feedback" id="lesson-feedback"></div>`:"";
  $("lesson-prev").disabled=lessonIndex===0;$("lesson-next").disabled=lessonIndex===LESSON_STEPS.length-1;
  speakLesson();
}
function checkLessonAnswer(button,value){
  document.querySelectorAll(".lesson-options button").forEach(option=>{option.disabled=true;if(option.textContent==="5,000")option.classList.add("ok");});
  const feedback=$("lesson-feedback");
  if(value===5000){feedback.textContent="🎉 נָכוֹן! 5 אֲלָפִים הֵם 5,000.";feedback.style.color="var(--green)";}
  else{button.classList.add("no");feedback.textContent="כִּמְעַט! הַסִּפְרָה 5 נִמְצֵאת בִּמְקוֹם הָאֲלָפִים.";feedback.style.color="var(--red)";}
}

function makeChoices(answer,candidates){
  const values=[answer,...candidates.filter(v=>v!==answer)];
  const step=Math.max(1,10**Math.max(0,String(Math.abs(answer)).length-2));
  let offset=1;
  while(new Set(values).size<4){
    values.push(Math.max(0,answer+(offset%2?offset:-offset)*step));
    offset++;
  }
  return shuffle([...new Set(values)]).slice(0,4);
}
function valueQuestion(){
  const n=rnd(100000,999999), place=10**rnd(0,5), digit=Math.floor(n/place)%10, answer=digit*place;
  const nearby=[digit*(place===1?10:place/10),digit*Math.min(place*10,1000000),place,(digit+1)*place]
    .filter(v=>Number.isInteger(v)&&v>=0&&v<=9000000);
  return {type:"value",kind:"עֵרֶךְ הַסִּפְרָה",q:`מָה הָעֵרֶךְ שֶׁל הַסִּפְרָה ${digit} בַּמִּסְפָּר?`,
    display:fmt(n),answer,choices:makeChoices(answer,nearby),explain:`הַסִּפְרָה ${digit} נִמְצֵאת בִּמְקוֹם שֶׁשָּׁוֶה לְ־${fmt(place)}. לָכֵן ${digit} × ${fmt(place)} = ${fmt(answer)}.`};
}
function compareQuestion(){
  const a=rnd(10000,999999), delta=rnd(1,9000), b=Math.min(999999,Math.max(10000,a+(Math.random()<.5?-delta:delta)));
  const answer=a===b?"=":a>b?">":"<";
  return {type:"compare",kind:"הַשְׁוָאַת מִסְפָּרִים",q:"אֵיזֶה סִימָן מַתְאִים בֵּין הַמִּסְפָּרִים?",display:`${fmt(a)}  ?  ${fmt(b)}`,
    answer,choices:["<","=",">"],explain:`מַשְׁוִים מִשְּׂמֹאל לְיָמִין. הַסִּפְרָה הָרִאשׁוֹנָה שֶׁשּׁוֹנָה קוֹבַעַת: ${fmt(a)} ${answer} ${fmt(b)}.`};
}
function roundQuestion(){
  let n=rnd(10000,999999); if(n%1000===500)n++;
  const answer=Math.round(n/1000)*1000, lower=Math.floor(n/1000)*1000, upper=lower+1000;
  return {type:"round",kind:"עִגּוּל לַאֲלָפִים",q:"עַגְּלוּ אֶת הַמִּסְפָּר לָאֶלֶף הַקָּרוֹב:",display:fmt(n),answer,
    choices:makeChoices(answer,[lower,upper,Math.round(n/100)*100,Math.round(n/10000)*10000]),
    explain:`הַמִּסְפָּר נִמְצָא בֵּין ${fmt(lower)} לְ־${fmt(upper)}. סִפְרַת הַמֵּאוֹת קוֹבַעַת אִם לַעֲלוֹת. הַתְּשׁוּבָה: ${fmt(answer)}.`};
}
function newQuestion(){
  let q,sig,tries=0;
  do{q=pick([valueQuestion,compareQuestion,roundQuestion])();sig=q.type+q.display;tries++;}while(sig===lastSig&&tries<10);
  current=q;lastSig=sig;locked=false;round++;
  $("round").textContent=round;$("kind").textContent=q.kind;$("question").textContent=q.q;$("number").textContent=q.display;
  $("feedback").textContent="";$("feedback").className="feedback";$("next").classList.add("hidden");$("help").classList.add("hidden");
  $("explain").classList.add("hidden");$("explain").textContent=q.explain;$("help").textContent="🔍 אֵיךְ פּוֹתְרִים?";
  $("choices").className="choices"+(q.type==="compare"?" symbols":"");
  $("choices").innerHTML="";
  q.choices.forEach(value=>{
    const b=document.createElement("button");b.className="choice";b.textContent=typeof value==="number"?fmt(value):value;
    b.onclick=()=>answer(b,value);$("choices").appendChild(b);
  });
}
function answer(button,value){
  if(locked)return;locked=true;
  const ok=value===current.answer;
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===(typeof current.answer==="number"?fmt(current.answer):current.answer))b.classList.add("ok");});
  if(ok){score+=10;$("score").textContent=score;$("feedback").textContent=pick(GOOD);$("feedback").className="feedback good";}
  else{button.classList.add("no");$("feedback").textContent=`כִּמְעַט! הַתְּשׁוּבָה הִיא ${typeof current.answer==="number"?fmt(current.answer):current.answer}`;$("feedback").className="feedback bad";}
  $("next").classList.remove("hidden");$("help").classList.remove("hidden");
}
function toggleExplain(){
  $("explain").classList.toggle("hidden");
  $("help").textContent=$("explain").classList.contains("hidden")?"🔍 אֵיךְ פּוֹתְרִים?":"🙈 הַסְתֵּר הֶסְבֵּר";
}
newQuestion();
if(new URLSearchParams(location.search).get("lesson")==="1")setTimeout(openLesson,0);
</script>
</body>
</html>
