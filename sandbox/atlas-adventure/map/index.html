<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Sandbox · Expedition Map</title><script src="../../../assets/atlas-progress.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;color:#eef8f7;background:radial-gradient(circle at 50% 0,#315f76,transparent 42%),linear-gradient(#081629,#102c40);font:17px/1.5 "Segoe UI",Arial,sans-serif}.shell{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px}.back,.reset,.island{border:1px solid rgba(211,235,239,.34);border-radius:16px;background:#183b52;color:#f4fbfa;text-decoration:none;font-weight:800}.back,.reset{padding:10px 14px}.reset{cursor:pointer}h1{text-align:center;color:#fff0b3;font-size:clamp(30px,6vw,50px);margin:18px 0 4px}.intro{text-align:center;color:#c9e4df;margin:0 auto 24px}.summary{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}.pill{padding:8px 13px;border-radius:99px;background:rgba(13,42,61,.86);border:1px solid rgba(211,235,239,.28)}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.island{position:relative;display:grid;grid-template-columns:72px 1fr;gap:13px;align-items:center;padding:18px;min-height:150px;box-shadow:0 12px 28px rgba(0,0,0,.24)}.icon{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;font-size:38px;background:linear-gradient(145deg,#376d79,#152f4d)}.island h2{margin:0;color:#fff0b3;font-size:21px}.island p{margin:4px 0;color:#c6dfdc;font-size:14px}.status{position:absolute;right:12px;top:10px;padding:3px 8px;border-radius:99px;background:#715b22;color:#fff4c5;font-size:11px}.complete{border-color:#79df9a}.complete .status{background:#235f3d}.finale{grid-column:2/3}.ending{display:none;margin:24px 0;padding:22px;border:1px solid #f4cf6a;border-radius:20px;background:rgba(50,38,70,.88);text-align:center}.ending.show{display:block}@media(max-width:820px){.map{grid-template-columns:1fr 1fr}.finale{grid-column:auto}}@media(max-width:560px){.map{grid-template-columns:1fr}}
</style></head>
<body data-atlas-mode="sandbox"><main class="shell"><div class="top"><a class="back" href="../../sandbox.html">← Sandbox</a><button class="reset" id="reset-map">Reset sandbox map</button></div><h1>Atlas Sandbox Map</h1><p class="intro">All chapters are unlocked here for testing. Sandbox and production progress remain separate.</p><div class="summary"><span class="pill" id="completion-count"></span><span class="pill" id="fragment-count"></span></div><section class="map" id="map"></section><section class="ending" id="ending"><h2>Sandbox expedition complete</h2><p>All six chapter completion signals were recorded.</p></section></main>
<script>
window.addEventListener("DOMContentLoaded",()=>{const islands=[["Cloud Harbor","🏝️","../index.html"],["Gale Garden","🌳","../island-two/index.html"],["Ember Archive","🔥","../island-three/index.html"],["Tidal Observatory","🌊","../island-four/index.html"],["Frostfire Summit","❄️","../island-five/index.html"],["The Unwritten Isle","✦","../island-six/index.html"]],state=AtlasProgress.load(),map=document.getElementById("map");islands.forEach(([title,icon,href],index)=>{const number=index+1,complete=Boolean(state.islands[String(number)]?.complete),card=document.createElement("a");card.className=`island ${complete?"complete":""} ${number===6?"finale":""}`;card.href=href;card.innerHTML=`<span class="status">${complete?"Complete":"Test chapter"}</span><span class="icon">${icon}</span><span><h2>${number}. ${title}</h2><p>Open the sandbox chapter and test all ten randomized challenges.</p></span>`;map.append(card)});const completeCount=Object.values(state.islands).filter(item=>item.complete).length;document.getElementById("completion-count").textContent=`${completeCount} of 6 islands complete`;document.getElementById("fragment-count").textContent=`${state.fragments.length} fragments collected`;document.getElementById("ending").classList.toggle("show",completeCount===6);document.getElementById("reset-map").onclick=()=>{if(confirm("Reset the sandbox expedition map?")){AtlasProgress.reset();location.reload()}}});
</script></body></html>
