<style>
  :root{--blue:#1f7fc4;--green:#3fbf6b;--red:#e6604f;--purple:#a974d6;--ink:#243b53;--shadow:rgba(20,60,90,.18);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#fff7e6,#cdeffd);display:flex;flex-direction:column;align-items:center;
    -webkit-user-select:none;user-select:none;}
  header{text-align:center;padding:14px 8px 4px;}
  .home{display:inline-block;background:#fff;border-radius:14px;padding:5px 12px;font-size:20px;line-height:1;text-decoration:none;
    box-shadow:0 3px 0 var(--shadow);margin-bottom:8px;}
  .logo{font-weight:900;font-size:clamp(27px,7vw,46px);color:#ffce3a;
    text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--blue),0 6px 14px var(--shadow);}
  .logo small{display:block;font-size:.43em;color:#155f93;text-shadow:none;margin-top:4px;}
  main{width:100%;max-width:700px;padding:8px 14px 30px;flex:1;}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px;gap:8px;}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-weight:900;box-shadow:0 4px 0 var(--shadow);}
  .learn{border:none;border-radius:16px;padding:9px 14px;background:var(--purple);color:#fff;font:800 15px inherit;cursor:pointer;box-shadow:0 4px 0 var(--shadow);}
  .card{background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 8px 0 var(--shadow);text-align:center;}
  h2{font-size:clamp(20px,5vw,27px);margin:0 0 12px;}
  .fractions{display:flex;align-items:center;justify-content:center;gap:18px;direction:ltr;margin:12px 0;}
  .fraction{display:inline-flex;flex-direction:column;align-items:center;font-size:clamp(36px,11vw,58px);font-weight:900;line-height:1;}
  .fraction .top{border-bottom:5px solid var(--ink);padding:0 12px 5px}.fraction .bottom{padding-top:5px}
  .mystery{font-size:45px;color:var(--purple);font-weight:900;}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px auto 20px;max-width:480px;direction:ltr;}
  .bar{height:34px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;display:flex;}
  .part{height:100%;border-right:1px solid rgba(36,59,83,.35)} .part.on{background:#ffce3a}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .choice{border:3px solid #ded2ee;background:#f5effb;border-radius:18px;padding:12px 8px;font:900 34px inherit;color:var(--ink);cursor:pointer;}
  .choice:active{transform:scale(.97)} .choice.ok{background:#d8f5e2;border-color:var(--green)} .choice.no{background:#fcdcd6;border-color:var(--red)}
  .feedback{min-height:38px;font-size:22px;font-weight:900;margin:16px 0 8px;}
  .feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button.action{border:none;border-radius:16px;padding:11px 18px;font:800 16px inherit;color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--shadow);}
  .help{background:var(--purple)} .next{background:var(--blue)}
  .explain{margin-top:14px;background:#f3ecfb;border:3px dashed #c9a8ec;border-radius:18px;padding:14px 16px;line-height:1.75;text-align:right;font-size:17px;}
  .calc{direction:ltr;display:inline-block;background:#fff;border-radius:8px;padding:1px 8px;font-weight:900;margin:2px;}
  .hidden{display:none!important;}
  .lesson-overlay{position:fixed;inset:0;background:rgba(20,40,60,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .lesson-overlay.show{display:flex;}
  .lesson-modal{background:#fff;border-radius:24px;width:100%;max-width:650px;max-height:94vh;overflow:auto;padding:22px 18px;text-align:center;box-shadow:0 18px 45px rgba(20,60,90,.35);}
  .lesson-close{float:left;border:none;background:#e7eef5;color:#43617c;border-radius:12px;padding:7px 11px;font:800 14px inherit;cursor:pointer;}
  .lesson-progress{color:var(--purple);font-weight:900;font-size:14px;clear:both;padding-top:4px;}
  .lesson-title{font-size:clamp(22px,6vw,30px);font-weight:900;color:#155f93;margin:8px 0;}
  .lesson-text{font-size:clamp(17px,4.5vw,21px);line-height:1.65;min-height:60px;}
  .lesson-visual{direction:ltr;font-size:clamp(31px,10vw,52px);font-weight:900;color:#155f93;margin:16px 0;background:#f4f9fd;border-radius:18px;padding:15px 8px;}
  .lesson-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;direction:ltr;margin:12px auto;max-width:500px;}
  .lesson-options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .lesson-options button{border:3px solid #d6e7f3;background:#fff;border-radius:14px;padding:10px 18px;font:900 24px inherit;cursor:pointer;}
  .lesson-options button.ok{background:#d8f5e2;border-color:var(--green)}.lesson-options button.no{background:#fcdcd6;border-color:var(--red)}
  .lesson-feedback{min-height:28px;font-weight:900;margin-top:8px;}
  .lesson-nav{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .lesson-nav button{border:none;border-radius:14px;padding:10px 15px;font:800 15px inherit;color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--shadow);}
  .gray{background:#8aa4bd}.green{background:var(--green)}.blue{background:var(--blue)}
  footer{padding:10px;color:#6b87a3;font-size:12px;}
</style>

</header>
<main>
  <div class="topbar"><div class="pill">שְׁאֵלָה <span id="round">1</span></div><button class="learn" onclick="openLesson()">📚 שִׁעוּר קָצָר</button><div class="pill">⭐ <span id="score">0</span></div></div>
  <div class="card">
    <h2>אֵיזֶה סִימָן מַתְאִים בֵּין הַשְּׁבָרִים?</h2>
    <div class="fractions">
      <div class="fraction"><span class="top" id="n1"></span><span class="bottom" id="d1"></span></div>
      <div class="mystery">?</div>
      <div class="fraction"><span class="top" id="n2"></span><span class="bottom" id="d2"></span></div>
    </div>
    <div class="bars"><div class="bar" id="bar1"></div><div class="bar" id="bar2"></div></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>

      <button class="action help" id="help" onclick="toggleExplain()">🔍 אֵיךְ פּוֹתְרִים?</button>

</main>
<div class="lesson-overlay" id="lesson-overlay">

    <button class="lesson-close" onclick="closeLesson()">✕ סְגֹר</button>

      <button class="gray" id="lesson-prev" onclick="moveLesson(-1)">◀ הַקּוֹדֵם</button>
      <button class="green" onclick="speakLesson()">🔊 הַשְׁמֵעַ</button>
      <button class="blue" id="lesson-next" onclick="moveLesson(1)">הַבָּא ▶</button>
    </div>

<script>
const $=id=>document.getElementById(id);
const rnd=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const pick=a=>a[rnd(0,a.length-1)];
const GOOD=["מְצֻיָּן! ⭐","נָכוֹן מְאוֹד! 🎉","כָּל הַכָּבוֹד! 👏","אַלּוּפֵי הַשְּׁבָרִים! 🏆"];
let score=0,round=0,current=null,locked=false,lastSig="";
let lessonIndex=0,hebrewVoice=null;

const LESSON_STEPS=[
  {title:"מָה מַשְׁוִים?",text:"כְּשֶׁמַּשְׁוִים שְׁבָרִים, בּוֹדְקִים אֵיזֶה שֶׁבֶר מְיַצֵּג חֵלֶק גָּדוֹל יוֹתֵר.",visual:"1/2  ?  1/4",bars:[{n:1,d:2},{n:1,d:4}],practice:false,say:"כשמשווים שברים, בודקים איזה שבר מייצג חלק גדול יותר. למשל, חצי גדול מרבע."},
  {title:"אוֹתוֹ מְכַנֶּה",text:"כְּשֶׁהַמְּכַנִּים שָׁוִים, הַשֶּׁבֶר עִם הַמּוֹנֶה הַגָּדוֹל יוֹתֵר הוּא הַגָּדוֹל.",visual:"3/8  >  1/8",bars:[{n:3,d:8},{n:1,d:8}],practice:false,say:"כשהמכנים שווים, משווים את המונים. שלוש שמיניות גדולות משמינית אחת."},
  {title:"מְכַנִּים שׁוֹנִים",text:"אֶפְשָׁר לִכְפֹּל בַּהֲצְלָבָה: 2 × 5 = 10, וְ־3 × 3 = 9.",visual:"2/3  >  3/5",bars:[{n:2,d:3},{n:3,d:5}],practice:false,say:"כשהמכנים שונים, אפשר לכפול בהצלבה. שתיים כפול חמש שווה עשר. שלוש כפול שלוש שווה תשע. לכן שני שלישים גדולים משלוש חמישיות."},
  {title:"עַכְשָׁו תּוֹרְכֶם!",text:"אֵיזֶה סִימָן מַתְאִים בֵּין 3/4 לְ־2/3?",visual:"3/4  ?  2/3",bars:[{n:3,d:4},{n:2,d:3}],practice:true,say:"עכשיו תורכם. איזה סימן מתאים בין שלושה רבעים לשני שלישים?"}
];
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  hebrewVoice=speechSynthesis.getVoices().find(v=>/^(he|iw)/i.test(v.lang))||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speakHebrew(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="he-IL";utterance.rate=.9;
  if(hebrewVoice)utterance.voice=hebrewVoice;speechSynthesis.speak(utterance);
}
function openLesson(){lessonIndex=0;$("lesson-overlay").classList.add("show");renderLesson();}
function closeLesson(){$("lesson-overlay").classList.remove("show");if("speechSynthesis" in window)speechSynthesis.cancel();}
function moveLesson(direction){const next=lessonIndex+direction;if(next<0||next>=LESSON_STEPS.length)return;lessonIndex=next;renderLesson();}
function speakLesson(){speakHebrew(LESSON_STEPS[lessonIndex].say);}
function lessonBar(f){
  let parts="";for(let i=0;i<f.d;i++)parts+=`<span class="part${i<f.n?" on":""}" style="width:${100/f.d}%"></span>`;
  return `<div class="bar">${parts}</div>`;
}
function renderLesson(){
  const step=LESSON_STEPS[lessonIndex];
  $("lesson-progress").textContent=`שָׁלָב ${lessonIndex+1} מִתּוֹךְ ${LESSON_STEPS.length}`;
  $("lesson-title").textContent=step.title;$("lesson-text").textContent=step.text;$("lesson-visual").textContent=step.visual;
  $("lesson-bars").innerHTML=step.bars.map(lessonBar).join("");
  $("lesson-practice").innerHTML=step.practice?`<div class="lesson-options">
    <button onclick="checkLessonAnswer(this,'<')">&lt;</button><button onclick="checkLessonAnswer(this,'=')">=</button><button onclick="checkLessonAnswer(this,'>')">&gt;</button>
    </div><div class="lesson-feedback" id="lesson-feedback"></div>`:"";
  $("lesson-prev").disabled=lessonIndex===0;$("lesson-next").disabled=lessonIndex===LESSON_STEPS.length-1;
  speakLesson();
}
function checkLessonAnswer(button,value){
  document.querySelectorAll(".lesson-options button").forEach(option=>{option.disabled=true;if(option.textContent===">")option.classList.add("ok");});
  const feedback=$("lesson-feedback");
  if(value===">"){feedback.textContent="🎉 נָכוֹן! 3 × 3 = 9, וְ־2 × 4 = 8.";feedback.style.color="var(--green)";}
  else{button.classList.add("no");feedback.textContent="כִּמְעַט! 9 גָּדוֹל מֵ־8, לָכֵן 3/4 > 2/3.";feedback.style.color="var(--red)";}
}

function gcd(a,b){while(b){[a,b]=[b,a%b]}return a;}
function makeFraction(){
  const d=rnd(2,12),n=rnd(1,d-1);return {n,d};
}
function buildQuestion(){
  let a=makeFraction(),b;
  if(Math.random()<.25){
    const reducedN=a.n/gcd(a.n,a.d),reducedD=a.d/gcd(a.n,a.d);
    const factors=[];for(let k=1;k<=Math.floor(12/reducedD);k++)if(reducedD*k>=2)factors.push(k);
    const k=pick(factors);b={n:reducedN*k,d:reducedD*k};
  }else b=makeFraction();
  const left=a.n*b.d,right=b.n*a.d,answer=left===right?"=":left>right?">":"<";
  return {a,b,left,right,answer};
}
function renderBar(id,f){
  $(id).innerHTML="";
  for(let i=0;i<f.d;i++){const part=document.createElement("span");part.className="part"+(i<f.n?" on":"");part.style.width=(100/f.d)+"%";$(id).appendChild(part);}
}
function newQuestion(){
  let q,sig,tries=0;do{q=buildQuestion();sig=`${q.a.n}/${q.a.d}:${q.b.n}/${q.b.d}`;tries++;}while(sig===lastSig&&tries<10);
  current=q;lastSig=sig;locked=false;round++;$("round").textContent=round;
  $("n1").textContent=q.a.n;$("d1").textContent=q.a.d;$("n2").textContent=q.b.n;$("d2").textContent=q.b.d;
  renderBar("bar1",q.a);renderBar("bar2",q.b);
  $("feedback").textContent="";$("feedback").className="feedback";$("next").classList.add("hidden");
  $("explain").classList.add("hidden");$("help").textContent="🔍 אֵיךְ פּוֹתְרִים?";
  $("explain").innerHTML=`כּוֹפְלִים בַּהֲצְלָבָה:<br><span class="calc">${q.a.n} × ${q.b.d} = ${q.left}</span>
    וְ־<span class="calc">${q.b.n} × ${q.a.d} = ${q.right}</span><br>
    מַשְׁוִים בֵּין הַתּוֹצָאוֹת: <span class="calc">${q.left} ${q.answer} ${q.right}</span>, לָכֵן
    <span class="calc">${q.a.n}/${q.a.d} ${q.answer} ${q.b.n}/${q.b.d}</span>.`;
  $("choices").innerHTML="";
  ["<","=",">"].forEach(v=>{const b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>answer(b,v);$("choices").appendChild(b);});
}
function answer(button,value){
  if(locked)return;locked=true;const ok=value===current.answer;
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===current.answer)b.classList.add("ok");});
  if(ok){score+=10;$("score").textContent=score;$("feedback").textContent=pick(GOOD);$("feedback").className="feedback good";}
  else{button.classList.add("no");$("feedback").textContent=`כִּמְעַט! הַסִּימָן הַנָּכוֹן הוּא ${current.answer}`;$("feedback").className="feedback bad";openExplain();}
  $("next").classList.remove("hidden");
}
function openExplain(){
  $("explain").classList.remove("hidden");$("help").textContent="🙈 הַסְתֵּר הֶסְבֵּר";
}
function toggleExplain(){
  $("explain").classList.toggle("hidden");$("help").textContent=$("explain").classList.contains("hidden")?"🔍 אֵיךְ פּוֹתְרִים?":"🙈 הַסְתֵּר הֶסְבֵּר";
}
newQuestion();
if(new URLSearchParams(location.search).get("lesson")==="1")setTimeout(openLesson,0);
</script>
