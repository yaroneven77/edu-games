<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080611" />
    <title>Neon Blocks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p>STACK · CLEAR · SURVIVE</p>
          <h1>NEON <span>BLOCKS</span></h1>
        </div>
        <button id="soundButton">SOUND ON</button>
      </header>

      <section class="game-layout">
        <aside class="left-panel">
          <div class="stat"><small>SCORE</small><strong id="score">000000</strong></div>
          <div class="stat"><small>HIGH SCORE</small><strong id="highScore">000000</strong></div>
          <div class="stat row"><span><small>LEVEL</small><strong id="level">01</strong></span><span><small>LINES</small><strong id="lines">000</strong></span></div>
          <div class="preview">
            <small>HOLD</small>
            <canvas id="holdCanvas" width="120" height="100"></canvas>
          </div>
        </aside>

        <div class="board-frame">
          <canvas id="gameCanvas" width="300" height="600" aria-label="Neon Blocks game board"></canvas>
          <div id="overlay" class="overlay">
            <p id="overlayTag">ARCADE PUZZLE</p>
            <h2 id="overlayTitle">NEON BLOCKS</h2>
            <p id="overlayText">Build clean. Think fast. Leave no gaps.</p>
            <button id="startButton">START GAME</button>
            <span>ARROWS / WASD TO MOVE</span>
          </div>
        </div>

        <aside class="right-panel">
          <div class="preview">
            <small>NEXT</small>
            <canvas id="nextCanvas" width="120" height="100"></canvas>
          </div>
          <div class="controls-list">
            <p><b>← →</b><span>MOVE</span></p>
            <p><b>↑ / X</b><span>ROTATE</span></p>
            <p><b>Z</b><span>ROTATE BACK</span></p>
            <p><b>↓</b><span>SOFT DROP</span></p>
            <p><b>SPACE</b><span>HARD DROP</span></p>
            <p><b>C</b><span>HOLD</span></p>
            <p><b>P</b><span>PAUSE</span></p>
          </div>
        </aside>
      </section>

      <nav class="touch-controls" aria-label="Touch controls">
        <button data-action="left">◀</button>
        <button data-action="rotate">↻</button>
        <button data-action="right">▶</button>
        <button data-action="hold">HOLD</button>
        <button data-action="down">▼</button>
        <button data-action="drop">DROP</button>
      </nav>
    </main>
    <script src="../atlas-game-bridge.js?v=5"></script>
    <script src="game.js"></script>
  </body>
</html>
