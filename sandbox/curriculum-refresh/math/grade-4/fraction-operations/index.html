<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>פְּעֻלּוֹת בִּשְׁבָרִים · כִּתָּה ד'</title>
<script src="../../../../../assets/theme-selector.js" defer></script>
<style>
  :root{--blue:#1f7fc4;--green:#3fbf6b;--red:#e6604f;--purple:#a974d6;--yellow:#ffce3a;--accent:#a974d6;--ink:#243b53;--shadow:rgba(20,60,90,.18)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#fff7e6,#cdeffd);display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none}
  header{text-align:center;padding:12px 8px 4px}
  .home{display:inline-block;background:#fff;border-radius:14px;padding:6px 13px;font-size:19px;text-decoration:none;
    box-shadow:0 3px 0 var(--shadow);margin-bottom:7px;color:#155f93;font-weight:900}
  .logo{font-weight:900;font-size:clamp(27px,7vw,45px);color:var(--yellow);
    text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--blue),0 6px 14px var(--shadow)}
  .logo small{display:block;font-size:.42em;color:#155f93;text-shadow:none;margin-top:4px}
  main{width:100%;max-width:760px;padding:8px 14px 30px;flex:1}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px;gap:8px}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-weight:900;box-shadow:0 4px 0 var(--shadow)}
  button{font-family:inherit}
  .learn{border:none;border-radius:16px;padding:10px 14px;background:var(--purple);color:#fff;font-size:15px;font-weight:900;
    cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
  .card{background:#fff;border-radius:24px;padding:21px 17px;box-shadow:0 8px 0 var(--shadow);text-align:center}
  .kind{display:inline-block;background:#eaf4fb;color:#155f93;border-radius:999px;padding:5px 13px;font-weight:900;font-size:14px}
  h2{font-size:clamp(20px,5vw,27px);line-height:1.55;margin:13px 0}
  .visual{direction:ltr;min-height:72px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;
    color:#155f93;font-size:clamp(27px,8vw,45px);font-weight:900;margin:12px 0 18px;background:#f4f9fd;border-radius:18px;padding:14px 10px;overflow:auto}
  .visual.rtl{direction:rtl;font-size:18px;line-height:1.7;text-align:right;display:block}
  .visual-note{font-size:16px;direction:rtl;color:#43617c;width:100%}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{border:3px solid color-mix(in srgb,var(--accent) 35%,#d6e7f3);background:color-mix(in srgb,var(--accent) 10%,#fff);
    border-radius:18px;padding:14px 8px;min-height:58px;font-size:clamp(18px,5vw,24px);font-weight:900;color:var(--ink);cursor:pointer;direction:rtl}
  .choice:active{transform:scale(.97)}.choice.ok{background:#d8f5e2;border-color:var(--green)}.choice.no{background:#fcdcd6;border-color:var(--red)}
  .feedback{min-height:38px;font-size:21px;font-weight:900;margin:15px 0 7px}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .action{border:none;border-radius:16px;padding:11px 18px;font-size:16px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
  .help{background:var(--purple)}.next{background:var(--blue)}
  .explain{margin-top:14px;background:#f3ecfb;border:3px dashed #c9a8ec;border-radius:18px;padding:14px 16px;line-height:1.75;text-align:right;font-size:17px}
  .calc{direction:ltr;display:inline-block;background:#fff;border-radius:8px;padding:1px 8px;font-weight:900;margin:2px}
  .hidden{display:none!important}
  .column-math{display:inline-grid;grid-template-columns:auto auto;direction:ltr;text-align:right;font-family:Consolas,monospace;min-width:180px}
  .column-math .operator{padding-right:10px}.column-math .line{grid-column:1/3;border-top:4px solid #243b53;margin-top:5px}
  .fraction{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;min-width:42px}
  .fraction .top{border-bottom:4px solid currentColor;padding:0 8px 4px}.fraction .bottom{padding-top:4px}
  .shape-svg{width:min(100%,330px);height:190px}.angle-svg{width:260px;height:150px}
  .data-table{border-collapse:collapse;font-size:16px;direction:rtl;color:var(--ink);background:#fff}
  .data-table th,.data-table td{border:2px solid #b9d7e8;padding:7px 10px}.data-table th{background:#dff2fb}
  .bar-chart{height:190px;display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;direction:rtl}
  .bar-item{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:48px;font-size:13px;color:var(--ink)}
  .bar-value{font-weight:900}.bar{width:38px;border-radius:9px 9px 0 0;background:linear-gradient(#ffce3a,#f0883e);border:2px solid #d87825}
  .bar-label{font-weight:800;margin-top:4px}
  .bag{display:flex;flex-wrap:wrap;gap:8px;max-width:300px;justify-content:center;border:5px solid #8a63d2;border-top:none;border-radius:10px 10px 40px 40px;padding:18px}
  .ball{width:31px;height:31px;border-radius:50%;border:2px solid rgba(36,59,83,.35)}
  .spinner{width:170px;height:170px;border-radius:50%;border:6px solid #243b53;position:relative}
  .spinner:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;background:#fff;border:4px solid #243b53;border-radius:50%;transform:translate(-50%,-50%)}
  .cube-stack{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:15px;color:var(--ink)}
  .cube-grid{display:grid;gap:3px;transform:skewY(-5deg)}
  .unit-cube{width:24px;height:24px;background:linear-gradient(135deg,#ffe58a,#ffb347);border:2px solid #cb7b23;border-radius:4px}
  .lesson-overlay{position:fixed;inset:0;background:rgba(20,40,60,.62);display:none;align-items:center;justify-content:center;padding:15px;z-index:50}
  .lesson-overlay.show{display:flex}
  .lesson-modal{background:#fff;border-radius:24px;width:100%;max-width:680px;max-height:94vh;overflow:auto;padding:21px 18px;text-align:center;box-shadow:0 18px 45px rgba(20,60,90,.35)}
  .lesson-close{float:left;border:none;background:#e7eef5;color:#43617c;border-radius:12px;padding:7px 11px;font-size:14px;font-weight:900;cursor:pointer}
  .lesson-progress{color:var(--purple);font-weight:900;font-size:14px;clear:both;padding-top:4px}
  .lesson-title{font-size:clamp(22px,6vw,30px);font-weight:900;color:#155f93;margin:8px 0}
  .lesson-text{font-size:clamp(17px,4.5vw,21px);line-height:1.65;min-height:56px}
  .lesson-rule{background:#fff4d6;border:2px dashed #e0a23a;border-radius:14px;padding:10px;font-weight:900;line-height:1.65;margin:10px 0}
  .lesson-visual{direction:ltr;font-size:clamp(25px,8vw,44px);font-weight:900;color:#155f93;margin:13px 0;background:#f4f9fd;border-radius:18px;padding:14px 8px;min-height:58px}
  .lesson-options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .lesson-options button{border:3px solid #d6e7f3;background:#fff;border-radius:14px;padding:10px 15px;font-size:18px;font-weight:900;cursor:pointer}
  .lesson-options button.ok{background:#d8f5e2;border-color:var(--green)}.lesson-options button.no{background:#fcdcd6;border-color:var(--red)}
  .lesson-feedback{min-height:28px;font-weight:900;margin-top:8px}
  .lesson-nav{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .lesson-nav button{border:none;border-radius:14px;padding:10px 15px;font-size:15px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
  .gray{background:#8aa4bd}.green{background:var(--green)}.blue{background:var(--blue)}
  footer{padding:10px;color:#6b87a3;font-size:12px;text-align:center}
  @media(max-width:460px){.choices{grid-template-columns:1fr}.visual{font-size:28px}.topbar{justify-content:center}.pill{padding:7px 11px}}
</style>
<link rel="stylesheet" href="../../../../../assets/refresh.css">

  #edu-refresh .lesson-overlay{z-index:100}
  #edu-refresh .lesson-modal{padding:24px 22px;max-height:94dvh}
  #edu-refresh .lesson-title{font-size:clamp(23px,5vw,29px);line-height:1.6}
  #edu-refresh .lesson-text{font-size:19px;line-height:1.9}
  #edu-refresh .lesson-progress{color:var(--refresh-muted)}
  #edu-refresh .lesson-rule{background:var(--refresh-soft);color:var(--refresh-text);border:1px solid var(--refresh-border);padding:14px;line-height:1.9}
  #edu-refresh .lesson-visual{padding:18px 10px;font-size:clamp(27px,7vw,43px);line-height:1.65;border-radius:16px;overflow-wrap:anywhere}
  #edu-refresh .lesson-options button{font:800 21px/1.5 "Segoe UI","Arial Hebrew",Arial,sans-serif;min-height:54px}
  #edu-refresh .lesson-feedback{color:var(--refresh-text)!important;line-height:1.8}
  #edu-refresh .lesson-feedback[style*="--green"]{color:#237849!important}
  #edu-refresh .lesson-feedback[style*="--red"]{color:#ac463b!important}
  html[data-edu-theme="space"] #edu-refresh .lesson-feedback[style*="--green"],html[data-edu-theme="arcade"] #edu-refresh .lesson-feedback[style*="--green"]{color:#93e5b4!important}
  html[data-edu-theme="space"] #edu-refresh .lesson-feedback[style*="--red"],html[data-edu-theme="arcade"] #edu-refresh .lesson-feedback[style*="--red"]{color:#ffb0a5!important}
  #edu-refresh .lesson-nav{gap:10px;margin-top:20px}
  #edu-refresh footer{line-height:1.8}
  @media(max-width:520px){
    #edu-refresh main{padding-inline:14px}
    #edu-refresh .card{padding:24px 16px}

    #edu-refresh .lesson-modal{padding:20px 14px}
    #edu-refresh .lesson-text{font-size:18px}

  }

  #edu-refresh .shape-svg,#edu-refresh .angle-svg{background:#fff;border-radius:12px;max-width:100%}
  #edu-refresh .column-math .line{border-color:currentColor}
  #edu-refresh .data-table{background:var(--refresh-surface);color:var(--refresh-text);max-width:100%}
  #edu-refresh .data-table th{background:var(--refresh-soft)}
  #edu-refresh .data-table th,#edu-refresh .data-table td{border-color:var(--refresh-border);padding:9px 8px;line-height:1.6}
  #edu-refresh .bar-item,#edu-refresh .cube-stack{color:var(--refresh-text)}
</style>
</head>
<body id="edu-refresh">
<header>
  <a class="home" href="../index.html" title="לְתַפְרִיט כִּתָּה ד'">⬆️🏠</a>
  <div class="logo">🍰 פְּעֻלּוֹת בִּשְׁבָרִים<small>חֶשְׁבּוֹן לְכִתָּה ד'</small></div>
</header>
<main>
  <div class="topbar">
    <div class="pill">שְׁאֵלָה <span id="round">1</span></div>
    <button class="learn" id="lesson-button" onclick="openLesson()">📚 שִׁעוּר קָצָר</button>
    <div class="pill">⭐ <span id="score">0</span></div>
  </div>
  <div class="card">
    <span class="kind" id="kind"></span>
    <h2 id="question"></h2>
    <div class="visual" id="visual"></div>

    <div class="actions">
      <button class="action help" id="help" onclick="toggleExplain()">🔍 אֵיךְ פּוֹתְרִים?</button>
      <button class="action next hidden" id="next" onclick="newQuestion()">הַבָּא ➜</button>
    </div>
    <div class="explain hidden" id="explain"></div>
  </div>
</main>
<div class="lesson-overlay" id="lesson-overlay" role="dialog" aria-modal="true" aria-label="שיעור קצר">
  <div class="lesson-modal">
    <button class="lesson-close" onclick="closeLesson()">✕ סְגֹר</button>
    <div class="lesson-progress" id="lesson-progress"></div>
    <div class="lesson-title" id="lesson-title"></div>
    <div class="lesson-text" id="lesson-text"></div>
    <div class="lesson-rule" id="lesson-rule"></div>
    <div class="lesson-visual" id="lesson-visual"></div>
    <div id="lesson-practice"></div>
    <div class="lesson-nav">
      <button class="gray" id="lesson-prev" onclick="moveLesson(-1)">◀ הַקּוֹדֵם</button>
      <button class="green" id="lesson-audio" onclick="speakLesson()">🔊 הַשְׁמֵעַ</button>
      <button class="blue" id="lesson-next" onclick="moveLesson(1)">הַבָּא ▶</button>
    </div>
  </div>
</div>
<footer>תֹּכֶן מְקוֹרִי · חֶשְׁבּוֹן לְכִתָּה ד'</footer>
<script>
const $=id=>document.getElementById(id);
let drawRandom=()=>Math.random();
const rnd=(min,max)=>Math.floor(drawRandom()*(max-min+1))+min;
const pick=a=>a[rnd(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>Number(n).toLocaleString("en-US");
const GOOD=["מְצֻיָּן! ⭐","נָכוֹן מְאוֹד! 🎉","כָּל הַכָּבוֹד! 👏","חֲשִׁיבָה נֶהְדֶּרֶת! 🏆"];
function numericChoices(answer,candidates=[],suffix=""){
  const values=[];
  [answer,...candidates].forEach(v=>{if(Number.isFinite(v)&&v>=0&&!values.includes(v))values.push(v)});
  let step=Math.max(1,Math.pow(10,Math.max(0,String(Math.floor(Math.abs(answer))).length-2))),offset=1;
  while(values.length<4){const v=answer+(offset%2?offset:-offset)*step;if(v>=0&&!values.includes(v))values.push(v);offset++}
  return shuffle(values.slice(0,4)).map(v=>fmt(v)+suffix);
}
function textChoices(answer,candidates){
  const values=[];[answer,...candidates].forEach(v=>{v=String(v);if(!values.includes(v))values.push(v)});
  return shuffle(values.slice(0,4));
}
function frac(n,d){return `<span class="fraction"><span class="top">${n}</span><span class="bottom">${d}</span></span>`}
function columnVisual(a,operator,b){return `<div class="column-math"><span></span><span>${fmt(a)}</span><span class="operator">${operator}</span><span>${fmt(b)}</span><span class="line"></span></div>`}
let score=0,round=0,current=null,locked=false,lastSignature="",lessonIndex=0,hebrewVoice=null;
const LESSON_STEPS=[{"title": "שֶׁבֶר מִכַּמּוּת", "text": "כְּדֵי לִמְצֹא שֶׁבֶר מִכַּמּוּת, מְחַלְּקִים בַּמְּכַנֶּה וּמַכְפִּילִים בַּמּוֹנֶה.", "rule": "רֶבַע מִ־20: מְחַלְּקִים 20 בְּ־4.", "visual": "<span class='calc'>20 ÷ 4 × 1 = 5</span>", "say": "כדי למצוא שבר מכמות, מחלקים במכנה ומכפילים במונה.", "practice": false, "options": [], "correct": 0, "good": "", "retry": ""}, {"title": "שְׁבָרִים שְׁקּוּלִים", "text": "כּוֹפְלִים אֶת הַמּוֹנֶה וְאֶת הַמְּכַנֶּה בְּאוֹתוֹ מִסְפָּר.", "rule": "הָעֵרֶךְ שֶׁל הַשֶּׁבֶר אֵינוֹ מִשְׁתַּנֶּה.", "visual": "<span class='calc'>1/3 = 2/6</span>", "say": "שליש שווה לשתי שישיות, כי כפלנו את המונה ואת המכנה בשתיים.", "practice": false, "options": [], "correct": 0, "good": "", "retry": ""}, {"title": "מְכַנֶּה זֵהֶה", "text": "בְּחִבּוּר וּבְחִסּוּר שֶׁל שְׁבָרִים עִם אוֹתוֹ מְכַנֶּה, פּוֹעֲלִים רַק עַל הַמּוֹנִים.", "rule": "הַמְּכַנֶּה נִשְׁאָר זֵהֶה.", "visual": "<span class='calc'>2/7 + 3/7 = 5/7</span>", "say": "כשיש אותו מכנה, מחברים או מחסרים את המונים ומשאירים את המכנה.", "practice": false, "options": [], "correct": 0, "good": "", "retry": ""}, {"title": "עַכְשָׁו תּוֹרְכֶם!", "text": "כַּמָּה הֵם שְׁנֵי שְׁלִישִׁים מִ־12?", "rule": "מְחַלְּקִים בְּ־3 וּמַכְפִּילִים בְּ־2.", "visual": "<span class='calc'>12 ÷ 3 × 2 = ?</span>", "say": "כמה הם שני שלישים מתוך שתים עשרה?", "practice": true, "options": ["8", "6", "4"], "correct": 0, "good": "12 ÷ 3 = 4, וְ־4 × 2 = 8.", "retry": "חַלְּקוּ 12 לְ־3 חֲלָקִים שָׁוִים."}];
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  hebrewVoice=speechSynthesis.getVoices().find(v=>/^(he|iw)/i.test(v.lang))||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
else{setTimeout(()=>{$("lesson-audio").disabled=true;$("lesson-audio").title="הַשְׁמָעָה אֵינָהּ זְמִינָה בַּדַּפְדְּפָן הַזֶּה"},0)}
function speakHebrew(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang="he-IL";utterance.rate=.9;
  if(hebrewVoice)utterance.voice=hebrewVoice;speechSynthesis.speak(utterance);
}
function openLesson(){lessonIndex=0;$("lesson-overlay").classList.add("show");renderLesson()}
function closeLesson(){$("lesson-overlay").classList.remove("show");if("speechSynthesis" in window)speechSynthesis.cancel()}
function moveLesson(direction){const next=lessonIndex+direction;if(next<0||next>=LESSON_STEPS.length)return;lessonIndex=next;renderLesson()}
function speakLesson(){speakHebrew(LESSON_STEPS[lessonIndex].say)}
function renderLesson(){
  const step=LESSON_STEPS[lessonIndex];
  $("lesson-progress").textContent=`שָׁלָב ${lessonIndex+1} מִתּוֹךְ ${LESSON_STEPS.length}`;
  $("lesson-title").textContent=step.title;$("lesson-text").textContent=step.text;$("lesson-rule").textContent=step.rule;
  $("lesson-visual").innerHTML=step.visual||"";$("lesson-visual").style.display=step.visual?"block":"none";
  const practice=$("lesson-practice");practice.innerHTML="";
  if(step.practice){
    const options=document.createElement("div");options.className="lesson-options";
    step.options.forEach((value,index)=>{const button=document.createElement("button");button.textContent=value;button.onclick=()=>checkLessonAnswer(button,index);options.appendChild(button)});
    const feedback=document.createElement("div");feedback.className="lesson-feedback";feedback.id="lesson-feedback";
    practice.append(options,feedback);
  }
  $("lesson-prev").disabled=lessonIndex===0;$("lesson-next").disabled=lessonIndex===LESSON_STEPS.length-1;
}
function checkLessonAnswer(button,index){
  const step=LESSON_STEPS[lessonIndex],buttons=document.querySelectorAll(".lesson-options button");
  buttons.forEach((option,i)=>{option.disabled=true;if(i===step.correct)option.classList.add("ok")});
  const feedback=$("lesson-feedback");
  if(index===step.correct){feedback.textContent="🎉 "+step.good;feedback.style.color="var(--green)"}
  else{button.classList.add("no");feedback.textContent="כִּמְעַט! "+step.retry;feedback.style.color="var(--red)"}
}

function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function formatFraction(n,d){
  const g=gcd(Math.abs(n),d);n/=g;d/=g;
  if(n%d===0)return String(n/d);
  if(n>d)return `${Math.floor(n/d)} ${n%d}/${d}`;
  return `${n}/${d}`;
}
function fractionOptions(answer,candidates){
  const pool=["1/2","1/3","2/3","3/4","4/5","1 1/2","2 1/3","3"];
  const values=[answer];
  for(const candidate of [...candidates,...pool]){
    if(!values.some(v=>Math.abs(fractionValue(v)-fractionValue(candidate))<1e-9))values.push(candidate);
  }
  for(let n=1;values.length<4;n++)if(!values.some(v=>Math.abs(fractionValue(v)-n)<1e-9))values.push(String(n));
  return shuffle(values.slice(0,4));
}
function quantityFractionQuestion(){
  const d=pick([2,3,4,5,6,8,10]),n=rnd(1,d-1),units=rnd(2,25),quantity=d*units,answerValue=n*units,answer=String(answerValue);
  return {kind:"שֶׁבֶר מִכַּמּוּת",question:`כַּמָּה הֵם ${n}/${d} מִ־${quantity}?`,visual:`${frac(n,d)} <span>× ${quantity}</span>`,answer,
    choices:numericChoices(answerValue,[units,quantity-n,answerValue+d]),
    explain:`מְחַלְּקִים בַּמְּכַנֶּה: <span class="calc">${quantity} ÷ ${d} = ${units}</span>. מַכְפִּילִים בַּמּוֹנֶה: <span class="calc">${units} × ${n} = ${answerValue}</span>.`};
}
function equivalentQuestion(){
  const d=rnd(3,16),n=rnd(1,d-1),k=rnd(2,6),answer=`${n*k}/${d*k}`;
  return {kind:"שְׁבָרִים שְׁקּוּלִים",question:`אֵיזֶה שֶׁבֶר שָׁקוּל לְ־${n}/${d}?`,visual:`${frac(n,d)} <span>= ?</span>`,answer,
    choices:fractionOptions(answer,[`${n+k}/${d+k}`,`${n*k}/${d}`,`${n}/${d*k}`]),
    explain:`כָּפַלְנוּ אֶת הַמּוֹנֶה וְאֶת הַמְּכַנֶּה בְּ־${k}: <span class="calc">${n}×${k}/${d}×${k} = ${answer}</span>.`};
}
function improperMixedQuestion(){
  const whole=rnd(1,5),d=rnd(2,9);const rem=pick(Array.from({length:d-1},(_,i)=>i+1).filter(n=>gcd(n,d)===1));const improper=whole*d+rem;
  if(Math.random()<.5){
    const answer=`${whole} ${rem}/${d}`;
    return {kind:"מִשֶּׁבֶר מְדֻמֶּה לְמִסְפָּר מְעֹרָב",question:"הָמִירוּ לְמִסְפָּר מְעֹרָב:",visual:frac(improper,d),answer,
      choices:fractionOptions(answer,[`${whole+1} ${rem}/${d}`,`${whole} ${d-rem}/${d}`,`${whole} ${rem}/${improper}`]),
      explain:`מְחַלְּקִים: <span class="calc">${improper} ÷ ${d} = ${whole}</span> וְנִשְׁאָר ${rem}. לָכֵן <span class="calc">${improper}/${d} = ${answer}</span>.`};
  }
  const answer=`${improper}/${d}`;
  return {kind:"מִמִּסְפָּר מְעֹרָב לְשֶׁבֶר מְדֻמֶּה",question:"הָמִירוּ לְשֶׁבֶר מְדֻמֶּה:",visual:`<span class="calc">${whole} ${rem}/${d}</span>`,answer,
    choices:fractionOptions(answer,[`${whole+d}/${d}`,`${whole*d}/${d}`,`${improper+1}/${d}`]),
    explain:`כּוֹפְלִים וּמְחַבְּרִים: <span class="calc">${whole} × ${d} + ${rem} = ${improper}</span>. הַמְּכַנֶּה נִשְׁאָר ${d}.`};
}
function sameDenominatorQuestion(){
  const d=rnd(3,12),isAdd=Math.random()<.6;let a,b,n;
  if(isAdd){a=rnd(1,d-1);b=rnd(1,d-1);n=a+b}else{a=rnd(2,d);b=rnd(1,a-1);n=a-b}
  const answer=formatFraction(n,d),op=isAdd?"+":"−";
  return {kind:"חִבּוּר וְחִסּוּר בְּאוֹתוֹ מְכַנֶּה",question:"פִּתְרוּ וְצַמְצְמוּ אִם אֶפְשָׁר:",visual:`${frac(a,d)} <span>${op}</span> ${frac(b,d)}`,answer,
    choices:fractionOptions(answer,[formatFraction(isAdd?Math.abs(a-b):a+b,d),formatFraction(n,d+1),formatFraction(n+1,d)]),
    explain:`הַמְּכַנֶּה נִשְׁאָר ${d}. ${isAdd?"מְחַבְּרִים":"מְחַסְּרִים"} אֶת הַמּוֹנִים: <span class="calc">${a} ${op} ${b} = ${n}</span>. הַתּוֹצָאָה הַמְצֻמְצֶמֶת: <span class="calc">${answer}</span>.`};
}
function wholeTimesFractionQuestion(){
  const whole=rnd(2,7),d=rnd(2,9),n=rnd(1,d-1),answer=formatFraction(whole*n,d);
  return {kind:"מִסְפָּר שָׁלֵם כָּפוּל שֶׁבֶר",question:"מָה תּוֹצָאַת הַכֶּפֶל?",visual:`<span>${whole} ×</span> ${frac(n,d)}`,answer,
    choices:fractionOptions(answer,[formatFraction(whole+n,d),formatFraction(n,whole*d),formatFraction((whole+1)*n,d)]),
    explain:`כּוֹפְלִים אֶת הַמּוֹנֶה בְּ־${whole}: <span class="calc">${whole} × ${n}/${d} = ${whole*n}/${d}</span>. מְצַמְצְמִים אוֹ כוֹתְבִים כְּמִסְפָּר מְעֹרָב: <span class="calc">${answer}</span>.`};
}
const BUILDERS=[quantityFractionQuestion,equivalentQuestion,improperMixedQuestion,sameDenominatorQuestion,wholeTimesFractionQuestion];

function newQuestion(){
  const question=freshQuestion(pick(BUILDERS)),signature=exerciseSignature(question);
  current=question;lastSignature=signature;locked=false;round++;$("round").textContent=round;
  $("kind").textContent=question.kind;$("question").textContent=question.question;
  $("visual").className="visual "+(question.visualClass||"");$("visual").innerHTML=question.visual||"";
  $("choices").innerHTML="";
  question.choices.forEach(value=>{const button=document.createElement("button");button.className="choice";button.textContent=value;button.onclick=()=>answerQuestion(button,value);$("choices").appendChild(button)});
  $("feedback").textContent="";$("feedback").className="feedback";$("next").classList.add("hidden");
  $("explain").classList.add("hidden");$("explain").innerHTML=question.explain;$("help").textContent="🔍 אֵיךְ פּוֹתְרִים?";
}
function answerQuestion(button,value){
  if(locked)return;locked=true;const ok=value===current.answer;
  document.querySelectorAll(".choice").forEach(option=>{option.disabled=true;if(option.textContent===current.answer)option.classList.add("ok")});
  if(ok){score+=10;$("score").textContent=score;$("feedback").textContent=pick(GOOD);$("feedback").className="feedback good"}
  else{button.classList.add("no");$("feedback").textContent=`כִּמְעַט! הַתְּשׁוּבָה הִיא ${current.answer}`;$("feedback").className="feedback bad";openExplain()}
  $("next").classList.remove("hidden");
}
function openExplain(){
  $("explain").classList.remove("hidden");$("help").textContent="🙈 הַסְתֵּר הֶסְבֵּר";
}
function toggleExplain(){
  $("explain").classList.toggle("hidden");$("help").textContent=$("explain").classList.contains("hidden")?"🔍 אֵיךְ פּוֹתְרִים?":"🙈 הַסְתֵּר הֶסְבֵּר";
}

function plainNumbers(text){return (String(text).replace(/,/g,"").match(/\d+/g)||[]).map(Number)}
function fractionValue(text){
  const parts=String(text).trim().split(" "),f=parts.pop().split("/").map(Number);
  return (parts.length?Number(parts[0]):0)+(f.length===2?f[0]/f[1]:f[0]);
}
function visualFractions(q){return [...q.visual.matchAll(/class="top">(\d+)<\/span><span class="bottom">(\d+)/g)].map(m=>[+m[1],+m[2]])}
function numericAnswer(q,value){return plainNumbers(q.answer)[0]===value}

// Exercise identity excludes shuffled answers and presentation-only chart/table changes.
const RECENT_LIMIT=32, recentExercises=new Map();
let freshnessFallbacks=0;
const reserveExercises=new Map();
function reserveQuestions(builder){
  if(reserveExercises.has(builder))return reserveExercises.get(builder);
  const questions=new Map(),previous=drawRandom;let seed=9173;
  try{
    drawRandom=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
    for(let i=0;i<4096&&questions.size<=RECENT_LIMIT;i++){
      const q=builder();questions.set(exerciseSignature(q),q);
    }
  }finally{drawRandom=previous}
  if(questions.size<=RECENT_LIMIT)throw new Error("Small exercise pool must be declared: "+builder.name);
  const pool=[...questions.values()];reserveExercises.set(builder,pool);return pool;
}
function exerciseSignature(q){
  if(q.signature)return q.signature;
  if(q.a&&q.b)return JSON.stringify([q.a,q.b]);
  return JSON.stringify([q.type||q.kind||"",q.q||q.question||"",q.expr||q.display||q.visual||""]);
}
function freshQuestion(builder,history=recentExercises){
  const key=builder.name,limit=Math.min(RECENT_LIMIT,(builder.capacity||Infinity)-1);
  const recent=history.get(key)||[];
  let q;
  if(builder.pool){
    const available=builder.pool.filter(item=>!recent.includes(exerciseSignature(item)));
    q=builder(pick(available).poolIndex);
  }else{
    for(let attempt=0;attempt<128;attempt++){
      q=builder();
      if(!recent.includes(exerciseSignature(q)))break;
    }
    // A 33-exercise reserve always has an option outside the 32-item recent history.
    if(recent.includes(exerciseSignature(q))){
      q=pick(reserveQuestions(builder).filter(item=>!recent.includes(exerciseSignature(item))));
      freshnessFallbacks++;
    }
  }
  recent.push(exerciseSignature(q));
  if(recent.length>limit)recent.splice(0,recent.length-limit);
  history.set(key,recent);
  return q;
}
function finitePool(builder,size){
  builder.pool=Array.from({length:size},(_,index)=>({...builder(index),poolIndex:index}));
  builder.capacity=new Set(builder.pool.map(exerciseSignature)).size;
}
function runContentSelfTest(){
  const failures=[],coverage=[];let assertions=0;
  const check=(ok,label)=>{assertions++;if(!ok&&failures.length<30)failures.push(label)};
  const before=freshnessFallbacks;
  for(const builder of CONTENT_BUILDERS){
    const seen=new Set();
    for(let i=0;i<500;i++){
      const q=builder(),choices=q.choices||["<","=",">"];
      check(choices.includes(q.answer),builder.name+": correct answer present");
      check(new Set(choices).size===choices.length,builder.name+": unique options");
      check(verifyGenerated(q,builder.name),builder.name+": mathematical answer and distractors");
      if(choices.every(v=>/^[\d,]+(?:\s|$)/.test(String(v))))check(choices.length===4,builder.name+": four numeric options");
      seen.add(exerciseSignature(q));
    }
    let repeats=0;
    // Five independent 100-question sequences; history tracks actual exercises, not choice order.
    for(let sequence=0;sequence<5;sequence++){
      const history=new Map(),recent=[],limit=Math.min(RECENT_LIMIT,(builder.capacity||Infinity)-1);
      for(let i=0;i<100;i++){
        const q=freshQuestion(builder,history),sig=exerciseSignature(q);
        if(recent.includes(sig))repeats++;
        recent.push(sig);if(recent.length>limit)recent.shift();
      }
    }
    check(repeats===0,builder.name+": zero repeats in recent window");
    coverage.push({type:builder.name,randomChecks:500,freshnessQuestions:500,recentWindow:Math.min(RECENT_LIMIT,(builder.capacity||Infinity)-1),repeats,poolSize:builder.capacity||null,sampledDistinct:seen.size});
  }
  contentRegressions(check);
  const ordinaryFallbacks=freshnessFallbacks-before;
  check(ordinaryFallbacks===0,"ordinary random generation needed no reserve");
  const random=Math.random;let recoveryChecks=0;
  try{
    Math.random=()=>0;
    for(const builder of CONTENT_BUILDERS.filter(b=>!b.pool)){
      const pool=reserveQuestions(builder),history=new Map(),recent=[];
      check(new Set(pool.map(exerciseSignature)).size===33,builder.name+": complete recovery reserve");
      for(let i=0;i<40;i++){
        const q=freshQuestion(builder,history),sig=exerciseSignature(q),choices=q.choices||["<","=",">"];
        check(!recent.includes(sig)&&verifyGenerated(q,builder.name)&&choices.includes(q.answer)&&new Set(choices).size===choices.length,builder.name+": stalled random source stays fresh and correct");
        recent.push(sig);if(recent.length>RECENT_LIMIT)recent.shift();recoveryChecks++;
      }
    }
  }finally{Math.random=random}
  window.__eduSelfTest={passed:failures.length===0,assertions,failures,coverage,freshnessFallbacks:ordinaryFallbacks,recoveryChecks};
}

function verifyGenerated(q,name){
  const f=visualFractions(q),n=plainNumbers(q.question),answer=fractionValue(q.answer);
  let expected;
  if(name==="quantityFractionQuestion")expected=n[0]/n[1]*n[2];
  else if(name==="equivalentQuestion")expected=f[0][0]/f[0][1];
  else if(name==="improperMixedQuestion")expected=f.length?f[0][0]/f[0][1]:fractionValue(q.visual.replace(/<[^>]*>/g,"").trim());
  else if(name==="sameDenominatorQuestion")expected=f[0][0]/f[0][1]+(q.visual.includes("−")?-1:1)*f[1][0]/f[1][1];
  else expected=plainNumbers(q.visual.replace(/<[^>]*>/g," "))[0]*f[0][0]/f[0][1];
  return Math.abs(answer-expected)<1e-9&&q.choices.filter(x=>Math.abs(fractionValue(x)-expected)<1e-9).length===1&&q.choices.length===4;
}
function contentRegressions(check){
  const options=fractionOptions("2/4",["1/2","3/6","4/8"]);
  check(options.length===4&&options.filter(x=>fractionValue(x)===.5).length===1,"equivalent distractors are not alternate correct answers");
}

const CONTENT_BUILDERS=BUILDERS;
if(new URLSearchParams(location.search).get("selftest")==="1")runContentSelfTest();
newQuestion();
if(new URLSearchParams(location.search).get("lesson")==="1")setTimeout(openLesson,0);
</script>
