<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05040d" />
    <title>Neon Squadron</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p>DEEP SPACE DEFENSE</p>
          <h1>NEON <span>SQUADRON</span></h1>
        </div>
        <button id="soundButton">SOUND ON</button>
      </header>

      <section class="hud">
        <div><small>SCORE</small><strong id="score">000000</strong></div>
        <div><small>HIGH SCORE</small><strong id="highScore">000000</strong></div>
        <div><small>WAVE</small><strong id="wave">01</strong></div>
        <div><small>SHIPS</small><strong id="lives">◆◆◆</strong></div>
        <label class="weapon-select">
          <small>WEAPON</small>
          <select id="weaponSelect" aria-label="Select weapon">
            <option value="laser">LASER</option>
            <option value="twin">TWIN SHOT</option>
            <option value="spread">SPREAD</option>
            <option value="missile">HOMING MISSILE</option>
            <option value="bomb">PLASMA BOMB</option>
            <option value="nova">NOVA EXPLOSION</option>
          </select>
        </label>
      </section>

      <div class="game-frame">
        <canvas id="gameCanvas" width="480" height="680" aria-label="Space shooter game"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlayTag">GALACTIC DEFENSE</p>
          <h2 id="overlayTitle">NEON SQUADRON</h2>
          <p id="overlayText">Break the formation. Survive the dive attacks.</p>
          <button id="startButton">LAUNCH</button>
          <span>ARROWS / WASD · SPACE TO FIRE</span>
        </div>
      </div>

      <nav class="touch-controls" aria-label="Touch controls">
        <button data-control="left">◀</button>
        <button data-control="fire">FIRE</button>
        <button data-control="right">▶</button>
      </nav>

      <footer>
        <span><b>MOVE</b> ← → / A D</span>
        <span><b>FIRE</b> SPACE / ↑</span>
        <span><b>PAUSE</b> P</span>
      </footer>
    </main>
    <script src="../atlas-game-bridge.js"></script>
    <script src="game.js"></script>
  </body>
</html>
