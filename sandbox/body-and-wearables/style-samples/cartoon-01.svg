  <title id="title">Milo — מילו</title>
  <desc id="desc">Original playful curly-haired cartoon explorer with a moderately sized round head, big sparkling eyes, soft cheeks and a wide happy smile. One hand hangs relaxed while the other grips a backpack strap. Terracotta overalls, teal striped shirt, rounded smiling backpack and oversized laced sneakers. Warm vector shading and playful cartoon proportions.</desc>
