<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Tali — טלי</title>
  <desc id="desc">Original cheerful fair-skinned girl with textured double hair puffs and braided hairline, golden short coat, indigo trousers, colorful rain boots and a friendly little bird-shaped crossbody bag. One open five-finger hand and a relaxed planted stance with naturally aligned legs. Dimensional gradient illustration at roughly four-and-a-half-head proportions.</desc>
